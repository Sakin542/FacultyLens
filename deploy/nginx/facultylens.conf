# FacultyLens production nginx: TLS termination, static React app, Laravel API via php-fpm.
# Mount TLS material at /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem.

upstream php_fpm { server app:9000; }

map $http_x_request_id $request_id_out { default $http_x_request_id; "" $request_id; }

# Application-level limits complement Laravel's throttles (per IP, burst tolerant)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;               # documents up to 20 MB + multipart overhead
    client_body_timeout 60s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Security headers (API responses also carry Laravel's headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # SPA CSP: self-hosted assets, Google Fonts (index.html), blob: for report downloads. No unsafe-eval.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    # Laravel API + Sanctum CSRF cookie → php-fpm (front controller only; no PHP files are ever served statically)
    location ~ ^/(api|sanctum)(/|$) {
        limit_req zone=api_zone burst=60 nodelay;
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REQUEST_ID $request_id_out;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 180s;          # AI analysis requests may take up to AI_SERVICE_TIMEOUT
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ ^/api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REQUEST_ID $request_id_out;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_hide_header X-Powered-By;
    }

    # Hashed build assets: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA fallback (index.html is never cached so new deployments are picked up)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
}
