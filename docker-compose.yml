services:
  # One-off: installs PHP dependencies into the backend_vendor volume (fast no-op when composer.lock is unchanged).
  # The four PHP services below start only after it succeeds.
  composer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["composer", "install", "--no-interaction", "--no-progress", "--prefer-dist", "--optimize-autoloader"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    restart: "no"
    networks:
      - facultylens-network

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-app
    restart: unless-stopped
    working_dir: /var/www/html
    # --no-reload is required for `artisan serve` to honour PHP_CLI_SERVER_WORKERS (restart the container after .env edits)
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      # vendor/ lives in a Docker volume: reading ~10,000 PHP files through the Windows bind mount made every
      # request boot Laravel in ~5 s; from the volume it boots in ~0.3 s. Your own code stays live-mounted.
      - backend_vendor:/var/www/html/vendor
    ports:
      - 8080:8000
    environment:
      # `php artisan serve` handles ONE request at a time by default; the SPA fires several API calls per page,
      # so they queued for seconds (dashboard/analytics/performance stuck on "Loading…"). Serve them in parallel.
      - PHP_CLI_SERVER_WORKERS=6
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=facultylens_app
      - REVERB_APP_KEY=facultylens_key
      - REVERB_APP_SECRET=facultylens_secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=
    depends_on:
      composer:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facultylens-network

  # Laravel Horizon: supervises Redis queue workers for the `default` (AI/report jobs) and `emails` queues.
  # Replaces the former database `queue:work` container. Restart after backend code changes: docker compose restart horizon
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      # vendor/ lives in a Docker volume: reading ~10,000 PHP files through the Windows bind mount made every
      # request boot Laravel in ~5 s; from the volume it boots in ~0.3 s. Your own code stays live-mounted.
      - backend_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=facultylens_app
      - REVERB_APP_KEY=facultylens_key
      - REVERB_APP_SECRET=facultylens_secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_CLIENT=predis
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      composer:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - facultylens-network

  # Laravel scheduler: daily database backup (02:00) and the retention purges in routes/console.php
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      # vendor/ lives in a Docker volume: reading ~10,000 PHP files through the Windows bind mount made every
      # request boot Laravel in ~5 s; from the volume it boots in ~0.3 s. Your own code stays live-mounted.
      - backend_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_CLIENT=predis
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      composer:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facultylens-network

  # Laravel Reverb: first-party WebSocket server for real-time notifications
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      # vendor/ lives in a Docker volume: reading ~10,000 PHP files through the Windows bind mount made every
      # request boot Laravel in ~5 s; from the volume it boots in ~0.3 s. Your own code stays live-mounted.
      - backend_vendor:/var/www/html/vendor
    ports:
      - 8085:8080
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=facultylens_app
      - REVERB_APP_KEY=facultylens_key
      - REVERB_APP_SECRET=facultylens_secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_CLIENT=predis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      composer:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - facultylens-network

  redis:
    image: redis:7-alpine
    container_name: facultylens-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - facultylens-network

  # Local SMTP capture for development / E2E (set MAIL_MAILER=mailpit). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: facultylens-mailpit
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - facultylens-network

  mysql:
    image: mysql:8.0
    container_name: facultylens-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: facultylens
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - 3307:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -u, root, -proot123]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - facultylens-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: facultylens-phpmyadmin
    restart: unless-stopped
    ports:
      - 8081:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - facultylens-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: facultylens-ai-service
    restart: unless-stopped
    ports:
      - 8001:8001
    environment:
      - APP_NAME=FacultyLens AI Service
      - APP_ENV=local
      - DEBUG=true
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - HF_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - HF_HOME=/app/cache/huggingface
      - AI_SERVICE_API_KEY=
      # STEP 25 rubric drafting: template engine by default; set a small seq2seq
      # model (e.g. google/flan-t5-small) and enable to use Hugging Face generation.
      - RUBRIC_GENERATION_ENABLED=false
      - RUBRIC_GENERATION_MODEL=
      # STEP 28 alignment thresholds (initial values; validate against faculty-reviewed examples).
      - RUBRIC_ALIGNMENT_STRONG_THRESHOLD=0.75
      - RUBRIC_ALIGNMENT_PARTIAL_THRESHOLD=0.55
      - RUBRIC_ALIGNMENT_WEAK_THRESHOLD=0.35
      # Local generation model (document chat, question generator, rubric drafts, syllabus drafts, variants).
      # Qwen2.5-0.5B-Instruct is small enough for CPU (~1 GB download, ~2 GB RAM). Empty = template/extractive engines.
      - HF_GENERATION_MODEL=${HF_GENERATION_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      - HF_GENERATION_MAX_NEW_TOKENS=256
      - CHAT_TOP_K=5
      - CHAT_MIN_RELEVANCE_SCORE=0.15
      - CHAT_MAX_CONTEXT_CHARS=6000
      - CHAT_MAX_HISTORY_MESSAGES=10
      # STEP 33 question generator (uses HF_GENERATION_MODEL; template engine fallback)
      - QUESTION_GENERATION_MAX_NEW_TOKENS=512
      - QUESTION_GENERATION_MAX_QUESTIONS=20
      # Optional hosted provider (OpenAI-compatible chat completions), used when the admin selects "hosted".
      # Hugging Face: LLM_HOSTED_BASE_URL=https://router.huggingface.co/v1 with an HF token as the key.
      - LLM_HOSTED_BASE_URL=${LLM_HOSTED_BASE_URL:-}
      - LLM_HOSTED_API_KEY=${LLM_HOSTED_API_KEY:-}
      - LLM_HOSTED_MODEL=${LLM_HOSTED_MODEL:-}
      # AI toolkit models (downloaded on first use into the ai_models_cache volume)
      - OCR_MODEL=microsoft/trocr-base-handwritten
      - ASR_MODEL=openai/whisper-base
      - ASR_MAX_SECONDS=5400
      - TRANSLATION_MODEL=facebook/nllb-200-distilled-600M
    volumes:
      - ./ai-service:/app
      - ai_models_cache:/app/cache/huggingface
    networks:
      - facultylens-network

volumes:
  backend_vendor:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
  ai_models_cache:
    driver: local

networks:
  facultylens-network:
    driver: bridge
