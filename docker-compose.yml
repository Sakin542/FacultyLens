services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - 8080:8000
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - facultylens-network

  # STEP 23/27: database queue worker for asynchronous AI jobs (grading, analysis, extraction).
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=2", "--timeout=200", "--sleep=2", "--max-jobs=500"]
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - QUEUE_CONNECTION=database
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - facultylens-network

  mysql:
    image: mysql:8.0
    container_name: facultylens-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: facultylens
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - 3307:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -u, root, -proot123]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - facultylens-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: facultylens-phpmyadmin
    restart: unless-stopped
    ports:
      - 8081:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - facultylens-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: facultylens-ai-service
    restart: unless-stopped
    ports:
      - 8001:8001
    environment:
      - APP_NAME=FacultyLens AI Service
      - APP_ENV=local
      - DEBUG=true
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - HF_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - HF_HOME=/app/cache/huggingface
      - AI_SERVICE_API_KEY=
      # STEP 25 rubric drafting: template engine by default; set a small seq2seq
      # model (e.g. google/flan-t5-small) and enable to use Hugging Face generation.
      - RUBRIC_GENERATION_ENABLED=false
      - RUBRIC_GENERATION_MODEL=
      # STEP 28 alignment thresholds (initial values; validate against faculty-reviewed examples).
      - RUBRIC_ALIGNMENT_STRONG_THRESHOLD=0.75
      - RUBRIC_ALIGNMENT_PARTIAL_THRESHOLD=0.55
      - RUBRIC_ALIGNMENT_WEAK_THRESHOLD=0.35
      # STEP 32 academic chat: MiniLM embeds only; leave HF_GENERATION_MODEL empty for the
      # extractive engine or set e.g. google/flan-t5-base for generative answers.
      - HF_GENERATION_MODEL=
      - HF_GENERATION_MAX_NEW_TOKENS=256
      - CHAT_TOP_K=5
      - CHAT_MIN_RELEVANCE_SCORE=0.35
      - CHAT_MAX_CONTEXT_CHARS=6000
      - CHAT_MAX_HISTORY_MESSAGES=10
      # STEP 33 question generator (uses HF_GENERATION_MODEL; template engine fallback)
      - QUESTION_GENERATION_MAX_NEW_TOKENS=512
      - QUESTION_GENERATION_MAX_QUESTIONS=20
    volumes:
      - ./ai-service:/app
      - ai_models_cache:/app/cache/huggingface
    networks:
      - facultylens-network

volumes:
  mysql_data:
    driver: local
  ai_models_cache:
    driver: local

networks:
  facultylens-network:
    driver: bridge
