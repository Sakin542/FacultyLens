services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - 8080:8000
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facultylens-network

  # Laravel Horizon: supervises Redis queue workers for the `default` (AI/report jobs) and `emails` queues.
  # Replaces the former database `queue:work` container. Restart after backend code changes: docker compose restart horizon
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_CLIENT=predis
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - facultylens-network

  redis:
    image: redis:7-alpine
    container_name: facultylens-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - facultylens-network

  # Local SMTP capture for development / E2E (set MAIL_MAILER=mailpit). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: facultylens-mailpit
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - facultylens-network

  mysql:
    image: mysql:8.0
    container_name: facultylens-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: facultylens
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - 3307:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -u, root, -proot123]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - facultylens-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: facultylens-phpmyadmin
    restart: unless-stopped
    ports:
      - 8081:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - facultylens-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: facultylens-ai-service
    restart: unless-stopped
    ports:
      - 8001:8001
    environment:
      - APP_NAME=FacultyLens AI Service
      - APP_ENV=local
      - DEBUG=true
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - HF_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - HF_HOME=/app/cache/huggingface
      - AI_SERVICE_API_KEY=
      # STEP 25 rubric drafting: template engine by default; set a small seq2seq
      # model (e.g. google/flan-t5-small) and enable to use Hugging Face generation.
      - RUBRIC_GENERATION_ENABLED=false
      - RUBRIC_GENERATION_MODEL=
      # STEP 28 alignment thresholds (initial values; validate against faculty-reviewed examples).
      - RUBRIC_ALIGNMENT_STRONG_THRESHOLD=0.75
      - RUBRIC_ALIGNMENT_PARTIAL_THRESHOLD=0.55
      - RUBRIC_ALIGNMENT_WEAK_THRESHOLD=0.35
      # STEP 32 academic chat: MiniLM embeds only; leave HF_GENERATION_MODEL empty for the
      # extractive engine or set e.g. google/flan-t5-base for generative answers.
      - HF_GENERATION_MODEL=
      - HF_GENERATION_MAX_NEW_TOKENS=256
      - CHAT_TOP_K=5
      - CHAT_MIN_RELEVANCE_SCORE=0.35
      - CHAT_MAX_CONTEXT_CHARS=6000
      - CHAT_MAX_HISTORY_MESSAGES=10
      # STEP 33 question generator (uses HF_GENERATION_MODEL; template engine fallback)
      - QUESTION_GENERATION_MAX_NEW_TOKENS=512
      - QUESTION_GENERATION_MAX_QUESTIONS=20
    volumes:
      - ./ai-service:/app
      - ai_models_cache:/app/cache/huggingface
    networks:
      - facultylens-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  ai_models_cache:
    driver: local

networks:
  facultylens-network:
    driver: bridge
