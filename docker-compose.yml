services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facultylens-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - 8080:8000
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=facultylens
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - facultylens-network

  mysql:
    image: mysql:8.0
    container_name: facultylens-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: facultylens
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - 3307:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -u, root, -proot123]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - facultylens-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: facultylens-phpmyadmin
    restart: unless-stopped
    ports:
      - 8081:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - facultylens-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: facultylens-ai-service
    restart: unless-stopped
    ports:
      - 8001:8001
    environment:
      - APP_NAME=FacultyLens AI Service
      - APP_ENV=local
      - DEBUG=true
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - HF_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - HF_HOME=/app/cache/huggingface
      - AI_SERVICE_API_KEY=
    volumes:
      - ./ai-service:/app
      - ai_models_cache:/app/cache/huggingface
    networks:
      - facultylens-network

volumes:
  mysql_data:
    driver: local
  ai_models_cache:
    driver: local

networks:
  facultylens-network:
    driver: bridge
