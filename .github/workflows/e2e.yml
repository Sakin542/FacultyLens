# Browser journeys (Playwright + axe) against the real stack: Laravel API + queue worker, the AI service, MySQL, Redis
# and Mailpit, with the production frontend build. Slower than CI (about 30-40 minutes), so it runs every night, after
# each merge to main, and on demand (Actions → Browser tests → Run workflow) — not on every pull request.
#
# The AI service runs with its small embedding model only (no local generation, no NLI or bge-m3 downloads): the
# journeys check the application's behaviour, not model quality. The AI course walkthrough needs real lecture PDFs, so
# it is skipped here (see playwright.config.ts).
name: Browser tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"   # 02:00 in Bangladesh

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_SERVICE_API_KEY: ci-internal-key   # shared by the API and the AI service inside this job only

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: facultylens
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
      mailpit:
        image: axllent/mailpit:v1.31.6   # same version as the local Docker stack
        ports: ["1025:1025", "8025:8025"]

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- AI service
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install AI service
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - name: Start AI service
        working-directory: ai-service
        env:
          HF_GENERATION_MODEL: ""
          CLAIM_CHECK_MODEL: ""
          ANSWER_SIMILARITY_MODEL: sentence-transformers/all-MiniLM-L6-v2
          TTS_BANGLA_ENGINE: mms
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8001 > ai-service.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8001/ready > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8001/ready

      # ---------------------------------------------------------------- Laravel API
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, gd, fileinfo, intl, zip, bcmath
          coverage: none
          # setup-php enables the opcache JIT by default; PHP 8.2's JIT mis-checks `self`
          # params in trait static methods once a path gets hot (Carbon rawAddUnit ->
          # "must be of type CarbonImmutable, CarbonImmutable given"), failing queue dispatch mid-run.
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - name: Configure and start the API
        working-directory: backend
        run: |
          cp .env.example .env
          set_env() { if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi; }
          set_env APP_ENV local
          set_env APP_DEBUG false
          set_env FRONTEND_URL http://127.0.0.1:4173
          set_env DB_HOST 127.0.0.1
          set_env DB_PASSWORD root
          set_env REDIS_HOST 127.0.0.1
          set_env QUEUE_CONNECTION redis
          set_env CACHE_STORE redis
          set_env BROADCAST_CONNECTION log
          set_env MAIL_MAILER smtp
          set_env MAIL_HOST 127.0.0.1
          set_env MAIL_PORT 1025
          set_env MAIL_USERNAME null
          set_env MAIL_PASSWORD null
          set_env MAIL_ENCRYPTION null
          set_env MAIL_FROM_ADDRESS noreply@facultylens.test
          set_env AI_SERVICE_URL http://127.0.0.1:8001
          set_env AI_SERVICE_API_KEY "$AI_SERVICE_API_KEY"
          php artisan key:generate --force
          php artisan migrate --force
          PHP_CLI_SERVER_WORKERS=4 nohup php artisan serve --host=127.0.0.1 --port=8080 > serve.log 2>&1 &
          nohup php artisan queue:work redis --queue=default,emails,ai-tools --tries=3 --timeout=600 > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/health

      # ---------------------------------------------------------------- browser journeys
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test --reporter=list,html

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/uat-results
            backend/serve.log
            backend/worker.log
            backend/storage/logs/*.log
            ai-service/ai-service.log
          retention-days: 7
