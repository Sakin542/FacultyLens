# FacultyLens PERFORMANCE nginx (STEP 43). Same routing as deploy/nginx/facultylens.conf but:
#   * plain HTTP on :80 (load generator and app share one host; TLS cost is not what is being measured)
#   * no per-IP limit_req zones — k6 comes from a single IP and would only measure nginx's 30 r/s limiter
# Laravel's own throttles (120/min api, 20/min auth, 30/min ai-analysis, ...) stay active and are tested separately.

upstream php_fpm { server app:9000; }

map $http_x_request_id $request_id_out { default $http_x_request_id; "" $request_id; }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 60s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_REQUEST_ID $request_id_out;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
}
